name: ci

# Every gate this repository has, on every push and every pull request. One job per shipped OS
# channel, one command per step, each step a real gate: a red step is a red build, and nothing here
# is advisory.
#
# The two POSIX legs have executed since the matrix landed, and they were red from that first run:
# nobody read them until after the 0.2.0 release push. Both causes were real - a trap handler
# shellcheck reads as unreachable, and an entrypoint guard that a symlinked payload defeats (macOS
# mounts its own temp directory behind one) - and both are fixed in the payload, not worked around
# here. Whether the legs are green is decided by the next run, not by this comment. They stay full
# gates rather than smoke tests precisely because that is what made them worth reading.
#
# Both actions are pinned at @v5 - the majors that run on Node 24, so the runner's Node 20
# deprecation warning is gone. setup-node v5's one breaking change is automatic package-manager
# caching when package.json declares a `packageManager`; this repository ships no package.json at
# all, so it cannot engage. checkout v6/v7 are deliberately NOT taken: they change credential
# persistence and fork-PR checkout, which is more than a version bump.
on:
  push:
  pull_request:

jobs:
  windows:
    # The channel the loop runs on today, and the only one with a live operator behind it: the
    # PowerShell wrappers, the pwsh-hosted resolver, and the example cycle on the windows answers.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No `npm install` step, and no cache: the plugin ships zero dependencies, no package.json and
      # no lockfile. Everything below runs on the Node that setup-node just installed.

      - name: migration payload is coherent
        run: node scripts/update/validate-payload.mjs

      - name: setup acceptance suite
        run: node scripts/setup/test-setup.mjs

      - name: update acceptance suite
        run: node scripts/update/test-update.mjs

      # The hook spikes are INCLUDED. Without --reference (or PNP_SPIKE_REFERENCE_HOOKS) they do not
      # silently degrade to nothing: the Gate 1 PARITY column reports SKIP and prints that it did,
      # while the whole expectation table - every payload's required decision for both gates - is
      # still enforced and can still fail. The reference implementation lives on an operator machine
      # and is not fetchable from a runner, so parity is a local check by nature.
      - name: hook spikes (expectation table; Gate 1 parity reports SKIP without a reference)
        run: node scripts/spike/run-spikes.mjs

      - name: example cycle (setup -> version bump -> update -> self-check)
        run: node scripts/ci/run-example-cycle.mjs

      - name: self-check
        run: node scripts/selfcheck/aiwf-selfcheck.js --plugin-root .

      # NOT a step, deliberately: `claude plugin validate`. The Claude Code CLI is not available on a
      # GitHub runner, so a step invoking it would either fail for a reason that has nothing to do
      # with this repository or be wrapped in a "continue-on-error" that reads as coverage while
      # asserting nothing. Plugin-manifest validation stays a local, operator-run check.

  ubuntu:
    # The bash channel, statically and end to end. Same gates as windows, on the linux answers file,
    # plus the one gate that exists only here: shellcheck.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # shellcheck is PREINSTALLED on the ubuntu runner image, so this costs no install step. It is
      # deliberately NOT part of the self-check: shellcheck is not on an operator machine, and a
      # self-check section that needed it would go red on every local run. The local static proof is
      # the self-check's own bash-channel assertions plus `bash -n`.
      - name: shellcheck the bash wrappers
        run: shellcheck scripts/native/sh/*.sh

      - name: migration payload is coherent
        run: node scripts/update/validate-payload.mjs

      - name: setup acceptance suite
        run: node scripts/setup/test-setup.mjs

      - name: update acceptance suite
        run: node scripts/update/test-update.mjs

      - name: hook spikes (expectation table; Gate 1 parity reports SKIP without a reference)
        run: node scripts/spike/run-spikes.mjs

      - name: example cycle on the linux answers (setup -> version bump -> update -> self-check)
        run: node scripts/ci/run-example-cycle.mjs --answers examples/example-project/answers-linux.json

      - name: self-check
        run: node scripts/selfcheck/aiwf-selfcheck.js --plugin-root .

  macos:
    # The second POSIX channel. macos runs the same gates as ubuntu with ONE deliberate omission,
    # written down here rather than left to be noticed: `shellcheck` is NOT preinstalled on the
    # macos runner image, and installing it through a package manager on every run would trade a
    # minute of build time for a lint this workflow already performs on ubuntu over the same files.
    # The bash channel is one set of files, so linting it twice proves nothing the ubuntu leg does
    # not already prove; what macos is here for is EXECUTION - a different bash (3.2 by default on
    # this image), a different mktemp, a different tmpdir layout.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: migration payload is coherent
        run: node scripts/update/validate-payload.mjs

      - name: setup acceptance suite
        run: node scripts/setup/test-setup.mjs

      - name: update acceptance suite
        run: node scripts/update/test-update.mjs

      - name: hook spikes (expectation table; Gate 1 parity reports SKIP without a reference)
        run: node scripts/spike/run-spikes.mjs

      - name: example cycle on the linux answers (setup -> version bump -> update -> self-check)
        run: node scripts/ci/run-example-cycle.mjs --answers examples/example-project/answers-linux.json

      - name: self-check
        run: node scripts/selfcheck/aiwf-selfcheck.js --plugin-root .
